# Gera o MesclarPDFs.exe no Windows do GitHub e publica na Release.
#
# Para lançar uma versão:
#   git tag v2.1.0
#   git push origin v2.1.0
#
# Também dá para rodar manualmente (aba Actions > Release > Run workflow):
# nesse caso o .exe fica só como artefato do run, sem criar Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Usar a versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $versao = "${{ github.ref_name }}".TrimStart("v")
          Set-Content -Path version.py -Value "__version__ = `"$versao`"" -Encoding utf8
          Write-Host "Versão: $versao"

      - name: Verificar se a janela abre
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); import main; main.theme_manager.apply(); main.MainWindow(); print('OK', main.__version__)"

      - name: Gerar executável
        run: python -m PyInstaller --noconfirm --clean MesclarPDFs.spec

      - name: Gerar SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/MesclarPDFs.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/MesclarPDFs.exe.sha256 -Value "$hash  MesclarPDFs.exe" -Encoding ascii -NoNewline
          Write-Host "SHA-256: $hash"

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: MesclarPDFs
          path: |
            dist/MesclarPDFs.exe
            dist/MesclarPDFs.exe.sha256

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MesclarPDFs.exe
            dist/MesclarPDFs.exe.sha256
          generate_release_notes: true
